# version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: go_api_template-psql
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - go_api_template_data:/var/lib/postgresql

  valkey:
    image: valkey/valkey
    container_name: go_api_template-valkey
    restart: unless-stopped

    ports:
      - "${CACHE_PORT:-6379}:6379"

    volumes:
      - go_api_template_valkey:/data

    command: valkey-server --save 60 1 --loglevel warning

volumes:
  go_api_template_data:
  go_api_template_valkey: