version: "3"

dotenv:
  - .env

includes:
  db:
    taskfile: ./internal/db/taskfile.yml
    dir: ./internal/db
  docker:
    taskfile: ./docker/taskfile.yml
    dir: ./docker

tasks:
  run:
    cmds:
      - go run ./cmd/api

  dev:
    desc: Run the API with live reload
    preconditions:
      - sh: command -v air >/dev/null 2>&1
        msg: "Air is not installed. Run: go install github.com/air-verse/air@latest"
    cmds:
      - air

  build:
    cmds:
      - go build -o bin/api ./cmd/api

  test:
    cmds:
      - go test ./...

  swagger:
    cmds:
      - swag init -g ./cmd/api/main.go --output ./docs