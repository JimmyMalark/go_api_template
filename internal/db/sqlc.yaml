version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "./migrations"

    queries:
      - "./queries"

    gen:
      go:
        package: db
        out: "./sqlc"
        sql_package: "pgx/v5"

        overrides:
          # DATE
          - db_type: "date"
            nullable: false
            go_type:
              import: "time"
              type: "Time"

          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # TIMESTAMPTZ
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"

          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true