basePath: /v1
definitions:
  httpx.ErrorResponse:
    properties:
      message:
        example: internal server error
        type: string
    type: object
  users.CreateUserRequest:
    properties:
      birth_date:
        example: "1998-05-14T00:00:00Z"
        type: string
      email:
        example: john@example.com
        type: string
      first_name:
        example: john
        maxLength: 100
        minLength: 3
        type: string
      last_name:
        example: doe
        maxLength: 100
        minLength: 3
        type: string
      username:
        example: john
        maxLength: 100
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  users.UserResponse:
    properties:
      birth_date:
        example: "1998-05-14T00:00:00Z"
        type: string
      email:
        example: john@example.com
        type: string
      first_name:
        example: john
        type: string
      last_name:
        example: doe
        type: string
      username:
        example: john
        type: string
      xid:
        example: 9m4e2mr0ui3e8a215n4g
        type: string
    type: object
info:
  contact: {}
  description: A production-ready Go API template.
  title: Go API Template
  version: "1.0"
paths:
  /admin/users:
    get:
      description: Get all users
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/users.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/users.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create user
      tags:
      - users
swagger: "2.0"
